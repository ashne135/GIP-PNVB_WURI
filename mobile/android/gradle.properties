# Mémoire de Gradle ramenée de 8 Go à 2 Go : largement suffisant pour cette
# application, et compatible avec un poste de 16 Go qui fait tourner en même temps
# un émulateur, l'éditeur et le serveur de développement.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
